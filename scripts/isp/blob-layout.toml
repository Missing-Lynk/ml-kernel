kind = "array"
elem = "f32"
count = 10
doc = "gain ladder, 5 float pairs"

[[section]]
name = "blc_entries"
stage = "blc"
offset = 0x0000b4
kind = "record_array"
count = 5
stride = 0x20
fields = { scale = 0x00, level = 0x10 }
doc = "5 pedestal records; four scale lanes then four level lanes"

