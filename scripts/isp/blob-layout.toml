# ---------------------------------------------------------------------------
# C names
#
# The macros ar-isp-blob.h emits, per section. Spelled out, not derived: `ccm1_gate` is
# `AR_ISP_CCM_BLOB_GATE` and no rule produces that from the section name.
#
# A name may appear under more than one section when the value is shared, as the two ladder header
# words are; the generator emits it once and fails if the values disagree.
# ---------------------------------------------------------------------------

[c_names]
blc_ladder      = { offset = "AR_ISP_BLC_BLOB_LADDER" }
blc_entries     = { offset = "AR_ISP_BLC_BLOB_TABLE", count = "AR_ISP_BLC_ENTRIES", stride = "AR_ISP_BLC_ENTRY_SIZE" }
rnr_header      = { offset = "AR_ISP_RNR_BLOB_HEADER" }
rnr_bands       = { offset = "AR_ISP_RNR_BLOB_BANDS" }
rnr_payload     = { offset = "AR_ISP_RNR_BLOB_PAYLOAD", stride = "AR_ISP_RNR_BLOB_STRIDE", count = "AR_ISP_RNR_BANDS" }
lnr_header      = { offset = "AR_ISP_LNR_BLOB_HEADER" }
lnr_bands       = { offset = "AR_ISP_LNR_BLOB_BANDS" }
lnr_payload     = { offset = "AR_ISP_LNR_BLOB_PAYLOAD", stride = "AR_ISP_LNR_BLOB_STRIDE", count = "AR_ISP_LNR_BANDS" }
de3d_header     = { offset = "AR_ISP_DE3D_BLOB_HEADER" }
de3d_bands      = { offset = "AR_ISP_DE3D_BLOB_BANDS" }
de3d_payload    = { offset = "AR_ISP_DE3D_BLOB_PAYLOAD", stride = "AR_ISP_DE3D_BLOB_STRIDE", count = "AR_ISP_DE3D_BANDS" }
cfa_header      = { offset = "AR_ISP_CFA_BLOB_HEADER" }
cfa_bands       = { offset = "AR_ISP_CFA_BLOB_BANDS" }
cfa_payload     = { offset = "AR_ISP_CFA_BLOB_PAYLOAD", stride = "AR_ISP_CFA_BLOB_STRIDE", count = "AR_ISP_CFA_BANDS" }
cnf_statics     = { offset = "AR_ISP_CNF_STATIC_BLOB" }
cnf_bands       = { offset = "AR_ISP_CNF_BLOB_BANDS" }
cnf_payload     = { offset = "AR_ISP_CNF_BLOB_PAYLOAD", stride = "AR_ISP_CNF_BLOB_STRIDE", count = "AR_ISP_CNF_BANDS" }
drc_header      = { offset = "AR_ISP_DRC_BLOB_HEADER" }
drc_bands       = { offset = "AR_ISP_DRC_BLOB_BANDS" }
drc_profiles    = { offset = "AR_ISP_DRC_BLOB_OFFSET", stride = "AR_ISP_DRC_BLOB_STRIDE", count = "AR_ISP_DRC_BLOB_PROFILES" }
gamma_header    = { offset = "AR_ISP_GAMMA_BLOB_HEADER" }
gamma_bands     = { offset = "AR_ISP_GAMMA_BLOB_BANDS" }
gamma_curves    = { offset = "AR_ISP_GAMMA_BLOB_OFFSET", stride = "AR_ISP_GAMMA_BLOB_STRIDE", count = "AR_ISP_GAMMA_BLOB_CURVES" }
ccm1_gate       = { offset = "AR_ISP_CCM_BLOB_GATE" }
ccm2_gate       = { offset = "AR_ISP_CCM2_BLOB_GATE" }
ccm_illuminants = { offset = "AR_ISP_CCM_BLOB_LADDER", count = "AR_ISP_CCM_BLOB_ILLUMINANTS" }
ccm_banks       = { offset = "AR_ISP_CCM_BLOB_BANKS", stride = "AR_ISP_CCM_BLOB_BANK_STRIDE", count = "AR_ISP_CCM_BLOB_BANKS_USED" }
lsc_grid_y      = { offset = "AR_ISP_LSC_BLOB_Y", count = "AR_ISP_LSC_GRID" }
lsc_grid_x      = { offset = "AR_ISP_LSC_BLOB_X" }
cm_header       = { offset = "AR_ISP_CM_HEADER" }
cm_aec_axis     = { offset = "AR_ISP_CM_AEC_AXIS", count = "AR_ISP_CM_AEC_ROWS" }
