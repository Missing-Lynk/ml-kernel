# The sensor tuning blob, as one mapping. Every consumer reads its offsets from here: the coverage
# tool, the per-stage checkers, the glue codecs, and (generated) the kernel and ml-aed.
#
# The vendor loads the file whole and addresses it by literal displacement from its base
# (isp_get_tuning_manager, the per-sensor array at +544, sensor index x 0x3b1e8, that sensor's image
# at +24). The file has no table of contents and no checksum; every offset came from reading the
# code that reads it, and each row says which.
#
# `offset` is ALWAYS absolute. C addresses several relatively, so grepping the tree for an absolute
# offset misses them: 0x79e0 is AR_ISP_RNR_BLOB_HEADER + AR_ISP_RNR_HDR_MODE. Relative
# displacements go in `fields` on the owning row.
#
# kinds:
#   gate          one u32, 0 or 1, checked by a stage before it runs
#   scalar        one value
#   array         `count` elements of `elem`, contiguous
#   record_array  `count` records of `stride` bytes
#   header        a small struct; `fields` names the displacements within it
#   bands         the float32 abscissa array a ladder selects on
#   payload       a ladder's payload records, `count` x `stride`
#   page          a large contiguous table the hardware fetches
#   opaque        extent known, interpretation not

[meta]
size = 0xd6c58
# One layout, three sensors; only the values differ. check-blob-layout.py tests that.
sensors = ["nt99235", "sc231", "sc2210"]

# ---------------------------------------------------------------------------
# blc
# ---------------------------------------------------------------------------

