cm2_header  = { interp = "AR_ISP_CM2_HDR_INTERP", aec_count = "AR_ISP_CM2_HDR_AEC_COUNT", ct_count = "AR_ISP_CM2_HDR_CT_COUNT" }

[c_absolute_fields]
# Header fields the driver reads without the header base, so they get a resolved absolute macro.
drc_header   = { count = "AR_ISP_DRC_BLOB_COUNT" }
gamma_header = { count = "AR_ISP_GAMMA_BLOB_COUNT" }
