rnr_header  = { enable = "AR_ISP_LADDER_HDR_ENABLE", interp = "AR_ISP_LADDER_HDR_INTERP", mode = "AR_ISP_RNR_HDR_MODE", count = "AR_ISP_RNR_HDR_COUNT", select = "AR_ISP_RNR_HDR_SELECT" }
